name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    uses: Revolutionized-IoT2/.github/.github/workflows/dotnet-validate.yml@main
    with:
      build: RIoT2.Net.Devices.sln
      test: Tests/RIoT2.Net.Devices.Tests.csproj
    secrets: inherit

  plugin:
    uses: Revolutionized-IoT2/.github/.github/workflows/plugin-release.yml@main
    with:
      project: RIoT2.Net.Devices.csproj
      # Names the required check; the same as RIoT2PluginPackage's default.
      package: RIoT2.Net.Devices
    secrets: inherit

  # The eufy-sdk bridge: its tests, and the committed bundle the plugin embeds must be what the build makes.
  eufy-sdk-bridge:
    uses: Revolutionized-IoT2/.github/.github/workflows/node-validate.yml@main
    with:
      working-directory: EufySdkBridge
      node-version: "24"
      scripts: "test build"
      verify-generated: true

  secret-scan:
    uses: Revolutionized-IoT2/.github/.github/workflows/secret-scan.yml@main
